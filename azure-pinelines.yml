trigger:
- main

variables:
- group: DockerAppDeployment
- name: tag
  value: $(Build.BuildId)
- name: dockerfilePath
  value: '$(Build.SourcesDirectory)/database/Containerfile'

stages:
- stage: Build
  displayName: Build and Push to ACR
  jobs:
  - job: Build
    pool: CICD-Agent
    steps:
    - checkout: self

    - task: Docker@2
      displayName: Build DB Image
      inputs:
        command: build
        repository: $(backendRepository)
        Dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          latest
          $(tag)

    - task: AzureCLI@2
      displayName: Scan DB Image
      inputs:
        azureSubscription: $(azureSubscriptionConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          for i in 1 2 3; do
            defender scan image $(containerRegistry)/$(backendRepository):$(tag) \
              --defender-output $(Build.ArtifactStagingDirectory)/$(backendRepository).sarif \
              --defender-break
            rc=$?
            if [ $rc -eq 0 ]; then
              break
            fi
            if [ $rc -ne 0 ] && [ $i -lt 3 ]; then
              echo "Scan failed with exit code $rc, retrying..."
              sleep 10
            else
              echo "Scan failed with exit code $rc"
              exit $rc
            fi
          done
      env:
        DEFENDER_TENANT_ID: $(DEFENDER_TENANT_ID)
        DEFENDER_CLIENT_ID: $(DEFENDER_CLIENT_ID)
        DEFENDER_CLIENT_SECRET: $(DEFENDER_CLIENT_SECRET)

    - task: Docker@2
      displayName: Push DB Image
      inputs:
        command: push
        repository: $(backendRepository)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          latest
          $(tag)

    - task: AzureCLI@2
      displayName: Scan and Upload to ACR Exchange Image
      inputs:
        azureSubscription: $(azureSubscriptionConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name $(containerRegistry)
          for i in 1 2 3; do
            defender scan image ghcr.io/indicate-eu/benchmarking-data-exchange-server:latest \
              --defender-output $(Build.ArtifactStagingDirectory)/$(frontendRepository).sarif \
              --defender-break
            rc=$?
            if [ $rc -eq 0 ]; then
              break
            fi
            if [ $rc -ne 0 ] && [ $i -lt 3 ]; then
              echo "Scan failed with exit code $rc, retrying..."
              sleep 10
            else
              echo "Scan failed with exit code $rc"
              exit $rc
            fi
          done
          skopeo copy --override-os linux --override-arch amd64 docker://ghcr.io/indicate-eu/benchmarking-data-exchange-server:latest docker://$(containerRegistry)/$(frontendRepository):latest
          skopeo copy --override-os linux --override-arch amd64 docker://ghcr.io/indicate-eu/benchmarking-data-exchange-server:latest docker://$(containerRegistry)/$(frontendRepository):$(tag)
      env:
        DEFENDER_TENANT_ID: $(DEFENDER_TENANT_ID)
        DEFENDER_CLIENT_ID: $(DEFENDER_CLIENT_ID)
        DEFENDER_CLIENT_SECRET: $(DEFENDER_CLIENT_SECRET)
    
    - task: PublishBuildArtifacts@1
      condition: always()
      inputs:
        PathtoPublish: $(Build.ArtifactStagingDirectory)
        ArtifactName: image-vulnerability-scans

    - task: Docker@2
      displayName: Build and Push Image
      inputs:
        command: buildAndPush
        tags: latest,$(tag)
        repository: $(backendRepository)
        containerRegistry: $(dockerRegistryServiceConnectionProd)
        Dockerfile: $(dockerfilePath)


    - task: AzureCLI@2
      inputs:
        azureSubscription: $(azureSubscriptionConnectionProd)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name $(containerRegistryProd)
          skopeo copy --override-os linux --override-arch amd64 docker://ghcr.io/indicate-eu/benchmarking-data-exchange-server:latest docker://$(containerRegistryProd)/$(frontendRepository):latest
          skopeo copy --override-os linux --override-arch amd64 docker://ghcr.io/indicate-eu/benchmarking-data-exchange-server:latest docker://$(containerRegistryProd)/$(frontendRepository):$(tag)


- stage: Deploy_nonprod
  displayName: Deploy to Azure Container Apps
  dependsOn: Build
  jobs:
  - deployment: Deploy_nonprod
    displayName: Deploy to Azure Container Apps Non Prod
    environment: benchmarking-nonprod
    pool: CICD-Agent
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureContainerApps@1
            displayName: Deploy to Azure Container App
            inputs:
              azureSubscription: $(azureSubscriptionConnection)
              imageToDeploy: $(containerRegistry)/$(frontendRepository):$(tag)
              containerAppName: $(frontendContainerAppName)
              resourceGroup: $(resourceGroup)
              environmentVariables: 'DATABASE_USER=$(POSTGRES_USER) DATABASE_PASSWORD=$(POSTGRES_PASSWORD) DATABASE_HOST=$(DATABASE_HOST) DATABASE_PORT=$(DATABASE_PORT) DATABASE_NAME=$(DATABASE_NAME) DATABASE_SCHEMA=$(DATABASE_SCHEMA)'

          - task: AzureContainerApps@1
            displayName: Deploy to Azure Container App
            inputs:
              azureSubscription: $(azureSubscriptionConnection)
              imageToDeploy: $(containerRegistry)/$(backendRepository):$(tag)
              containerAppName: $(backendContainerAppName)
              resourceGroup: $(resourceGroup)
              environmentVariables: 'POSTGRES_USER=$(POSTGRES_USER) POSTGRES_PASSWORD=$(POSTGRES_PASSWORD) POSTGRES_DB=$(POSTGRES_DB) PGDATA=$(PGDATA)'

- stage: Deploy_prod
  displayName: Deploy to Azure Container Apps on Prod (green slot)
  dependsOn: Deploy_nonprod
  # Serialize runs that touch the same Container Apps: an Exclusive Lock check on
  # the `benchmarking-prod` environment holds the lock, and `sequential` makes queued
  # runs wait and run in order rather than acting on stale label/traffic reads.
  lockBehavior: sequential
  jobs:
  - deployment: Deploy_prod
    displayName: Deploy to Azure Container Apps Prod
    environment: benchmarking-prod
    pool: CICD-Agent
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: Deploy Frontend (exchange server) to green slot
            inputs:
              azureSubscription: $(azureSubscriptionConnectionProd)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                APP="$(frontendContainerAppName)"
                RG="$(resourceGroup)"
                SUFFIX="b$(Build.BuildId)"

                # Read everything the label-bootstrap decisions need in ONE snapshot, so
                # MODE/HAS_BLUE/HAS_GREEN/latestReadyRevisionName all come from a single
                # consistent read instead of several `az containerapp show` calls that
                # could race with a concurrent update.
                SNAP=$(az containerapp show --name "$APP" --resource-group "$RG" \
                  --query "[properties.configuration.activeRevisionsMode, length(properties.configuration.ingress.traffic[?label=='blue']), length(properties.configuration.ingress.traffic[?label=='green']), properties.latestReadyRevisionName]" \
                  -o tsv)
                IFS=$'\t' read -r MODE HAS_BLUE HAS_GREEN CUR_REV <<< "$SNAP"

                # Ensure the app is in multiple-revision mode (required for labels).
                if [ "$(printf '%s' "$MODE" | tr '[:upper:]' '[:lower:]')" != "multiple" ]; then
                  az containerapp revision set-mode \
                    --name "$APP" --resource-group "$RG" --mode multiple >/dev/null
                fi

                # Bootstrap labels on a cold app: `ingress traffic set --label-weight
                # blue=100 green=0` fails with "No labels 'blue, green' assigned to any
                # traffic weight" until both labels exist. A revision can hold only one
                # label, so seed `blue` on the live revision here; `green` is assigned to
                # the new revision created below. No-op once both labels already exist.
                if [ "$HAS_BLUE" = "0" ]; then
                  # Guard: a cold app might not have a ready revision yet. Don't call
                  # `revision label add` with an empty/null revision name — fail clearly.
                  if [ -z "$CUR_REV" ] || [ "$CUR_REV" = "null" ]; then
                    echo "ERROR: $APP has no ready revision to seed the 'blue' label on." >&2
                    exit 1
                  fi
                  az containerapp revision label add \
                    --name "$APP" --resource-group "$RG" --label blue --revision "$CUR_REV" --yes >/dev/null
                fi

                # Re-assert weights, but only reference labels that are actually
                # assigned, otherwise the command fails on the unassigned one.
                if [ "$HAS_GREEN" = "0" ]; then
                  az containerapp ingress traffic set \
                    --name "$APP" --resource-group "$RG" --label-weight blue=100 >/dev/null
                else
                  az containerapp ingress traffic set \
                    --name "$APP" --resource-group "$RG" --label-weight blue=100 green=0 >/dev/null
                fi

                PREV_BLUE=$(az containerapp show --name "$APP" --resource-group "$RG" \
                  --query "properties.configuration.ingress.traffic[?label=='blue'].revisionName | [0]" -o tsv)
                PREV_GREEN=$(az containerapp show --name "$APP" --resource-group "$RG" \
                  --query "properties.configuration.ingress.traffic[?label=='green'].revisionName | [0]" -o tsv)

                az containerapp update \
                  --name "$APP" --resource-group "$RG" \
                  --image "$(containerRegistryProd)/$(frontendRepository):$(tag)" \
                  --revision-suffix "$SUFFIX" \
                  --replace-env-vars \
                    "DATABASE_USER=$(POSTGRES_USER)" \
                    "DATABASE_PASSWORD=$(POSTGRES_PASSWORD)" \
                    "DATABASE_HOST=$(DATABASE_HOST)" \
                    "DATABASE_PORT=$(DATABASE_PORT)" \
                    "DATABASE_NAME=$(DATABASE_NAME)" \
                    "DATABASE_SCHEMA=$(DATABASE_SCHEMA)"

                NEW_REV="${APP}--${SUFFIX}"

                az containerapp revision label remove \
                  --name "$APP" --resource-group "$RG" --label green || true
                az containerapp revision label add \
                  --name "$APP" --resource-group "$RG" \
                  --label green --revision "$NEW_REV" --yes

                if [ -n "$PREV_GREEN" ] && [ "$PREV_GREEN" != "$PREV_BLUE" ] && [ "$PREV_GREEN" != "$NEW_REV" ]; then
                  az containerapp revision deactivate \
                    --name "$APP" --resource-group "$RG" --revision "$PREV_GREEN"
                fi


- stage: Promote_prod
  displayName: Promote green to live (manual approval)
  dependsOn: Deploy_prod
  # Same exclusive lock so a promote can't race a deploy on the same apps.
  lockBehavior: sequential
  jobs:
  - deployment: Promote_prod
    environment: benchmarking-prod
    pool: CICD-Agent
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: Swap labels (frontend only)
            inputs:
              azureSubscription: $(azureSubscriptionConnectionProd)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                # Promote = swap labels AND move traffic.
                # `revision label swap` only renames the labels; it does not
                # change traffic weights. We must follow with `ingress traffic
                # set` to actually flip 100% traffic onto the new blue.
                az containerapp revision label swap \
                  --name "$(frontendContainerAppName)" --resource-group "$(resourceGroup)" \
                  --source green --target blue
                az containerapp ingress traffic set \
                  --name "$(frontendContainerAppName)" --resource-group "$(resourceGroup)" \
                  --label-weight blue=100 green=0
